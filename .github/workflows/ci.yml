name: CI

on:
  pull_request:
  push:
    branches:
      - 'release/*'

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EnumClassSourceGenerator.slnx

      - name: Build
        run: dotnet build EnumClassSourceGenerator.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test EnumClassSourceGenerator.slnx --configuration Release --no-build --no-restore

      - name: Test packed NuGet package
        run: dotnet test EnumClasses.CompatibilityTesting.NugetPackage/EnumClasses.CompatibilityTesting.NugetPackage.csproj --configuration Release

      - name: Pack NuGet package
        if: github.event_name == 'push'
        run: dotnet pack EnumClasses.Package/EnumClasses.Package.csproj --configuration Release --no-build --no-restore --output artifacts/packages

      - name: Upload NuGet package artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: enum-classes-nuget
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish to NuGet.org
    if: github.event_name == 'push'
    needs: build-test-pack
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download NuGet package artifact
        uses: actions/download-artifact@v5
        with:
          name: enum-classes-nuget
          path: artifacts/packages

      - name: Log in to NuGet.org with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: DDaarcon

      - name: Publish NuGet package
        run: >-
          dotnet nuget push artifacts/packages/*.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
